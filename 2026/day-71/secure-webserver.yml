---
- name: Deploy secure web server
  hosts: app
  become: true

  roles:
    - role: webserver
      vars:
        app_name: secure-app
        http_port: 80
        app_env: production

  tasks:
    - name: Create secure configuration
      template:
        src: secure-config.j2
        dest: /etc/nginx/conf.d/secure-app-secrets.conf
        owner: root
        group: root
        mode: '0600'
      no_log: true
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
